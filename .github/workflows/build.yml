name: Build APK

# GameScrub — GameHub with PC-accurate XInput rumble plus a port of
# bannerhub-revanced's privacy patch set. Adds dual-motor low/high
# dispatch + preload-free SDL rumble keepalive (winebus.so duration
# patched on disk) and kills Firebase / GMS Measurement / Mob Push /
# XiaoJi heartbeat+events / JieLi OTA on top of stock GameHub 6.1.2.
# Otherwise unchanged from upstream Tencent build.
#
# One-time setup: upload the original GameHub APK as an asset on a
# release tagged `base-apk-6.1.2` in this repo. The workflow
# `gh release download`s from there.

on:
  push:
    tags:
      - 'v*-6.1.2*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve base version
        id: base
        run: |
          # Only 6.1.2 is supported. Kept as a step so downstream steps can
          # still reference steps.base.outputs.* without restructuring.
          echo "version=6.1.2" >> "$GITHUB_OUTPUT"
          echo "release_tag=base-apk-6.1.2" >> "$GITHUB_OUTPUT"
          # The PC engine is a separately-downloaded plugin from 6.1.1 on, and
          # the dual-motor rumble hooks live inside it. Upload the plugin APK
          # (pulled from a device: files/plugins/com.xiaoji.egggame.plugin.pcengine/
          # base.apk) as an asset on this tag. Must match the versionCode in
          # extension/BhPluginShadow.java#EXPECTED_PLUGIN_VERSION_CODE.
          #
          # 6.1.2 bumped the plugin contract: the host hard-requires plugin
          # schemaVersion == 3 (6.1.1 required 2), so the 101 plugin is rejected
          # outright with "PC engine plugin schema 2 is not supported". Plugin 102
          # (versionName 102-3) is the schema-3 build; it must match
          # EXPECTED_PLUGIN_VERSION_CODE in extension/BhPluginShadow.java.
          #
          # If this asset is missing the build still works, but ships with
          # dual-motor OFF *and* the plugin-side privacy kills inert -- the
          # heartbeat (Steam ID64) and device-perf stubs ride the same shadow dex.
          echo "plugin_tag=pcengine-plugin-102" >> "$GITHUB_OUTPUT"
          echo "Base version: 6.1.2"

      - name: Download original GameHub APK
        run: |
          gh release download "${{ steps.base.outputs.release_tag }}" --pattern "*.apk" -D base/ -R ${{ github.repository }}
          ls base/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download PC engine plugin APK
        id: plugin
        run: |
          # Optional in the sense that the build still SUCCEEDS without it, but
          # it costs more than rumble: the shadow dex carries the dual-motor hooks
          # AND the plugin-side privacy stubs, so omitting it leaves the heartbeat
          # (Steam ID64 every 30 s) and device-perf telemetry live. Sustained rumble
          # is genuinely unaffected — that is a winebus patch on the Wine component
          # tree, not the plugin.
          if gh release download "${{ steps.base.outputs.plugin_tag }}" \
                --pattern "*.apk" -D plugin/ -R ${{ github.repository }}; then
            echo "have_plugin=1" >> "$GITHUB_OUTPUT"
            ls -l plugin/
          else
            echo "have_plugin=0" >> "$GITHUB_OUTPUT"
            echo "::warning::No ${{ steps.base.outputs.plugin_tag }} release asset;"\
                 "building WITHOUT dual-motor rumble AND WITHOUT the plugin-side"\
                 "privacy kills (heartbeat/device-perf) — shadow dex omitted."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install apktool
        run: |
          APKTOOL_VER=2.9.3
          mkdir -p $HOME/bin
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar" -O $HOME/bin/apktool.jar
          wget -q "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" -O $HOME/bin/apktool
          chmod +x $HOME/bin/apktool
          echo "$HOME/bin" >> $GITHUB_PATH
          java -jar $HOME/bin/apktool.jar --version

      - name: Decompile APK
        run: |
          APK=$(ls base/*.apk | head -1)
          echo "Decompiling: $APK"
          java -jar $HOME/bin/apktool.jar d "$APK" -o apktool_out -f

      - name: Strip newer-Android manifest attributes apktool 2.9.3 can't reassemble
        run: |
          # 6.0.x's AndroidManifest uses two attributes whose namespaces aren't in
          # the framework apktool 2.9.3 ships with. They're cosmetic (BLUETOOTH_SCAN
          # flag + predictive-back opt-in); stripping is harmless for a vibration-mod
          # test build.
          python3 - <<'PYEOF'
          import re
          with open('apktool_out/AndroidManifest.xml', 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r' android:usesPermissionFlags="[^"]*"', '', content)
          content = re.sub(r' android:enableOnBackInvokedCallback="[^"]*"', '', content)
          with open('apktool_out/AndroidManifest.xml', 'w', encoding='utf-8') as f:
              f.write(content)
          print("manifest stripped")
          PYEOF

      - name: Apply BhVibration smali patches
        run: |
          # On 6.1.1+ this applies ONLY the winebus disk-patch trigger, injected
          # into the base APK's own PcEnginePluginHostActivity.onCreate — which
          # runs in the ":pcengine" process on every game launch, before the
          # plugin's Wine activity starts. That restores sustained rumble past
          # SDL's ~1 s rumble_expiration, because winebus.so did NOT move into
          # the plugin: it is still a downloaded Wine component under
          # <filesDir>/usr, which is the tree BhVibrationController already
          # walks.
          #
          # The three dual-motor dispatch hooks (onRumble entry, Physical
          # dispatch/stop) are NOT applied on 6.1.1+ — those classes moved into
          # the downloaded plugin. See README ("PC engine plugin"). The script
          # detects the layout itself and reports exactly what it applied.
          python3 scripts/apply_vibration_patches.py apktool_out

      - name: Apply privacy patches
        run: |
          # Port of bannerhub-revanced's privacy patch set, scoped to this
          # fork's apktool/Python pipeline. Kills Firebase Analytics +
          # GMS Measurement + Mob Push + the two vgabc.com /events endpoints
          # + the heartbeat playtime tracker + the JieLi OTA URL/native libs.
          # See scripts/apply_privacy_patches.py docstring for the full
          # channel list and the deliberately-skipped surface (Crashlytics
          # settings probe, Steam / GOG / Epic, image CDNs).
          python3 scripts/apply_privacy_patches.py apktool_out

      - name: Apply per-game vibration menu patches
        run: |
          # Injects a "PC Vibration Settings" row into the three per-game
          # menu surfaces (game detail More Menu, library-tile popup,
          # library-list 3-dot popup) so users can change Mode/Intensity
          # per game without launching BhVibrationSettingsActivity by adb.
          # Manifest registers the activity; CVR + resolver short-circuit
          # carry the row label; index-0 captureGameId pins per-game scope.
          # See scripts/apply_menu_patches.py docstring for the full anchor
          # set; if a future base bump shifts the obfuscated class letters
          # the script fails loudly at the missing anchor.
          python3 scripts/apply_menu_patches.py apktool_out

      - name: Apply VJoy export/import patches
        run: |
          # Replaces GameHub's cloud-only on-screen-controls share flow with
          # portable local .gtheme files (no cloud account, no HTTP). Export
          # reads the pristine pre-CDN layout bytes and saves via SAF; import
          # fires a SAF file picker at the import-dialog composition, parses
          # the .gtheme, and registers the layout in egggame.db. The four
          # bytecode hooks are anchored by server-stable URL fragments
          # (vcontroller/shareMap | getMapByShareCode | uploadGtheme) and the
          # upload call-relationship — not R8 letters — so they survive
          # reshuffles. Label relabels + the import-dialog skip ride on the
          # StringResourcesKt.stringResource short-circuit installed by the
          # menu patches.
          # Fails loudly if any anchor is missing or non-unique.
          python3 scripts/apply_export_controls_patches.py apktool_out

      - name: Apply background update-check patch
        run: |
          # Starts com.xj.winemu.update.BhSteamUpdateChecker from the
          # Application's onCreate so the per-game "Online Update" red dot
          # stays fresh for every installed Steam game without the user
          # having to launch the game first. Stock GameHub only runs the
          # Steam update check on lazy launch/detail paths, so the badge
          # lags reality; this background worker periodically (and on app
          # foreground) re-runs the host's own per-app check for each
          # installed appId (enumerated from <filesDir>/Steam/steamapps/
          # appmanifest_*.acf) via the same withContext dispatch the host's
          # own bulk sweep uses, which refreshes the badge flow. The only
          # smali edit is a single start() call injected into onCreate;
          # everything else is in the extension class. Fails loudly if the
          # onCreate anchor is missing or non-unique.
          python3 scripts/apply_update_check_patches.py apktool_out

      - name: Build PC engine plugin shadow dex (dual-motor rumble + telemetry kill)
        if: steps.plugin.outputs.have_plugin == '1'
        run: |
          set -e
          # Patch the PLUGIN's rumble classes and assemble ONLY those classes
          # into a ~7 KB dex. At runtime BhPluginShadow prepends it to the
          # plugin's DexClassLoader dexPath so our copies win, while the plugin's
          # base.apk is never modified — its SHA-256 identity record therefore
          # stays valid and no forging is needed. See the README section
          # "PC engine plugin".
          PLUGIN_APK=$(ls plugin/*.apk | head -1)
          java -jar $HOME/bin/apktool.jar d "$PLUGIN_APK" -o plugin_out -f
          python3 scripts/apply_plugin_rumble_patches.py plugin_out
          # Privacy: the device-performance telemetry channel that 6.0.9 stubbed
          # in the base APK moved into this plugin (per-session fps/power/RAM/GPU
          # profile tied to user_id + gameId, uploaded on activity destroy).
          python3 scripts/apply_plugin_privacy_patches.py plugin_out
          mkdir -p apktool_out/assets
          python3 scripts/build_plugin_shadow_dex.py \
              plugin_out apktool_out/assets/bh_pcengine_shadow.dex \
              $HOME/bin/apktool.jar
          # Base-APK side: route the plugin's dexPath through BhPluginShadow.
          python3 scripts/apply_plugin_shadow_patches.py apktool_out
          ls -l apktool_out/assets/bh_pcengine_shadow.dex

      - name: Rebuild and sign
        run: |
          set -e

          # Rebuild
          java -jar $HOME/bin/apktool.jar b apktool_out -o rebuilt-unsigned.apk

          # Compile vibration extension Java + d8 to classes<N>.dex, where
          # <N> is the next free dex slot after the rebuilt APK's stock dex
          # files, computed dynamically below. (6.1.1 has 4 stock dex files
          # → classes5; 6.0.9 had 5 → classes6.)
          ANDROID_JAR=$(ls $ANDROID_SDK_ROOT/platforms/android-*/android.jar 2>/dev/null | sort -V | tail -1)
          mkdir -p ext_classes
          # Compile the whole directory rather than an explicit file list. The
          # list silently rotted when BhPluginShadow.java was added: local builds
          # used extension/*.java and passed, CI kept its stale list and failed
          # with "cannot find symbol: class BhPluginShadow". A glob cannot drift.
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d ext_classes \
              extension/*.java
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)
          mkdir -p ext_dex
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/d8 \
              --release --min-api 29 --output ext_dex \
              $(find ext_classes -name "*.class")
          MAX_DEX=$(unzip -l rebuilt-unsigned.apk | awk '
              match($0, /classes([0-9]*)\.dex$/, m) {
                  n = (m[1] == "" ? 1 : m[1] + 0);
                  if (n > max) max = n;
              }
              END { print max + 0 }
          ')
          NEXT_DEX=$((MAX_DEX + 1))
          DEX_NAME="classes${NEXT_DEX}.dex"
          echo "Rebuilt APK has ${MAX_DEX} stock dex files; injecting extension as ${DEX_NAME}"
          cp ext_dex/classes.dex "$DEX_NAME"
          zip -j rebuilt-unsigned.apk "$DEX_NAME"

          # Align
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/zipalign -f -v 4 \
              rebuilt-unsigned.apk rebuilt-aligned.apk

          # Sign with the repo's testkey.
          OUT="GameScrub-${{ steps.base.outputs.version }}.apk"
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner sign \
              --key testkey.pk8 --cert testkey.x509.pem \
              --out "$OUT" \
              rebuilt-aligned.apk
          ls -lh "$OUT"
          echo "out_apk=$OUT" >> "$GITHUB_ENV"
          echo "out_artifact=GameScrub-${{ steps.base.outputs.version }}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.out_artifact }}
          path: ${{ env.out_apk }}
